<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Игра</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext x='50' y='50' font-family='Times New Roman, Times, serif' font-size='100' fill='black' text-anchor='middle' dominant-baseline='central'%3ES%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="game.css">
</head>
<body>
    <video src="../climbing.webm" id="bg" autoplay loop muted playsinline preload="auto"></video>

    <div id="sidebar">
        <div id="turn-info">
            Ход: <span id="turn-number">—</span>
        </div>

        <div id="country-info">
            <div id="country-name">—</div>
            <div id="country-treasury">Казна: —</div>
            <div id="country-tiles">Провинций: —</div>
        </div>

        <div id="participants-panel">
            <div id="participants-count-line">
                Участники (<span id="participants-count">0</span>)
            </div>
            <ul id="participants-list"></ul>
        </div>

        <div id="orders-panel">
            <div id="orders-header">Приказы</div>
            <div id="invest-status" hidden>
                <span class="invest-label">Инвестиции:</span>
                <input type="text" inputmode="numeric" autocomplete="off"
                       id="invest-amount" value="0">
                <span class="invest-unit">₵</span>
                <span id="invest-count">0 тайл(ов)</span>
                <button id="invest-clear" type="button">Очистить</button>
            </div>
            <ul id="orders-list"></ul>
            <div id="orders-buttons">
                <button id="order-buy-btn" type="button">Купить войска</button>
                <button type="button" data-mode="invest"         id="mode-invest">Инвестиции (E)</button>
                <button type="button" data-mode="gift"           id="mode-gift">Подарок (G)</button>
                <button type="button" data-mode="retreat"        id="mode-retreat">Отступление (R)</button>
                <button type="button" data-mode="move"           id="mode-move">Перемещение (A)</button>
                <button type="button" data-mode="supportAttack"  id="mode-attack">Поддержка атаки (S)</button>
                <button type="button" data-mode="supportDefense" id="mode-defense">Поддержка обороны (D)</button>
                <button type="button" data-mode="rename"         id="mode-rename">Переименовать (N)</button>
                <button id="orders-reset-btn" type="button">Сбросить все приказы</button>
            </div>
            <div id="orders-hint">
                Кликните свой тайл, затем соседний — чтобы добавить движение.
            </div>
        </div>

        <div id="ready-bar">
            <button id="ready-btn" type="button">Готов</button>
        </div>

        <div id="afk-panel">
            <button id="afk-toggle" type="button">АФК</button>
        </div>

        <div id="history-scrubber" hidden></div>
    </div>

    <a href="../index.html" id="back-to-main">На главную</a>

    <div id="viewport">
        <div id="map-display"></div>
    </div>

    <div id="map-status"></div>

    <div id="turn-view-bar" hidden>
        <button id="back-btn" type="button" hidden>◀ Назад</button>
        <button id="forward-btn" type="button" hidden>Вперёд ▶</button>
    </div>

    <!-- Обобщённая модалка с числами (Orders 6/7/8) -->
    <div id="troop-modal" class="order-modal" hidden>
        <div class="order-modal-overlay" id="troop-overlay"></div>
        <div class="order-modal-box">
            <div class="modal-title" id="troop-title">—</div>
            <div class="modal-subtitle" id="troop-max">—</div>
            <label class="modal-field">
                Пехота:
                <input type="text" inputmode="numeric" autocomplete="off" id="troop-inf" value="0">
            </label>
            <label class="modal-field">
                Пушки:
                <input type="text" inputmode="numeric" autocomplete="off" id="troop-can" value="0">
            </label>
            <div class="modal-buttons">
                <button id="troop-ok" class="modal-ok" type="button">OK</button>
                <button id="troop-cancel" type="button">Отмена</button>
            </div>
        </div>
    </div>

    <!-- Покупка (Order 4) -->
    <div id="order-buy-modal" class="order-modal" hidden>
        <div class="order-modal-overlay" id="order-buy-overlay"></div>
        <div class="order-modal-box">
            <div class="modal-title">Покупка войск</div>
            <div class="modal-subtitle" id="order-buy-budget">—</div>
            <label class="modal-field">
                Пехота (1 ₵):
                <input type="text" inputmode="numeric" autocomplete="off" id="order-buy-inf" value="0">
            </label>
            <label class="modal-field">
                Пушки (3 ₵):
                <input type="text" inputmode="numeric" autocomplete="off" id="order-buy-can" value="0">
            </label>
            <div class="modal-cost" id="order-buy-cost">Итого: 0 ₵</div>
            <div class="modal-buttons">
                <button id="order-buy-ok" type="button">OK</button>
                <button id="order-buy-cancel" type="button">Отмена</button>
            </div>
        </div>
    </div>

    <!-- Модалка с одним числом (Orders 1, 3) -->
    <div id="money-modal" class="order-modal" hidden>
        <div class="order-modal-overlay" id="money-overlay"></div>
        <div class="order-modal-box">
            <div class="modal-title" id="money-title">—</div>
            <div class="modal-subtitle" id="money-max">—</div>
            <label class="modal-field">
                <span id="money-label">Сумма, ₵:</span>
                <input type="text" inputmode="numeric" autocomplete="off" id="money-input" value="0">
            </label>
            <div class="modal-buttons">
                <button id="money-ok" class="modal-ok" type="button">OK</button>
                <button id="money-cancel" type="button">Отмена</button>
            </div>
        </div>
    </div>

    <!-- Универсальная модалка подтверждения (Order 5) -->
    <div id="confirm-modal" class="order-modal" hidden>
        <div class="order-modal-overlay" id="confirm-overlay"></div>
        <div class="order-modal-box">
            <div class="modal-title" id="confirm-title">—</div>
            <div class="modal-subtitle" id="confirm-body">—</div>
            <div class="modal-buttons">
                <button id="confirm-ok" class="modal-ok" type="button">OK</button>
                <button id="confirm-cancel" type="button">Отмена</button>
            </div>
        </div>
    </div>

    <!-- Переименование -->
    <div id="rename-modal" class="order-modal" hidden>
        <div class="order-modal-overlay" id="rename-overlay"></div>
        <div class="order-modal-box">
            <div class="modal-title" id="rename-title">Переименовать провинцию</div>
            <label class="modal-field">
                <span>Название:</span>
                <input type="text" id="rename-input" maxlength="40" autocomplete="off"
                       style="width: 180px;">
            </label>
            <div class="modal-buttons">
                <button id="rename-ok" class="modal-ok" type="button">OK</button>
                <button id="rename-cancel" type="button">Отмена</button>
            </div>
        </div>
    </div>

    <script type="module" src="game.bundle.js"></script>
</body>
</html>
