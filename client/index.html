<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<title>Spiel</title>
	<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext x='50' y='50' font-family='Times New Roman, Times, serif' font-size='100' fill='black' text-anchor='middle' dominant-baseline='central'%3ES%3C/text%3E%3C/svg%3E">
</head>
<body>
	<h1>Hello world</h1>
	<div id="output">Загрузка...</div>
	<script id="embedded" type="module">
        console.log("Hello, world!");
        const response = await fetch('spiel.wasm');
        const bytes = await response.arrayBuffer();

        let memory;

        const importObject = {
            env: {
                js_log(ptr, len) {
                    const buf = new Uint8Array(memory.buffer, ptr, len);
                    console.log("[C]:", new TextDecoder().decode(buf));
                }
            }
        };


        const { instance } = await WebAssembly.instantiate(bytes, importObject);
        const { alloc, process, get_errno, get_memory_base} = instance.exports;
        memory = instance.exports.memory;

        const ptr = alloc(4, 4, 10);
        console.log(ptr);
        if (get_errno() !== 0) {
            document.getElementById('output').textContent = "Ошибка выделения: " + get_errno();
        }

        process(ptr, 10);

        const base = get_memory_base();
        const result = new Uint32Array(memory.buffer, base + ptr, 10);
        document.getElementById('output').textContent = Array.from(result).join(', ');
                
        const proto = location.protocol === 'https:'? 
            'wss://':
            'ws://';
        const ws = new WebSocket(`${proto}${location.host}/ws`);

        ws.onopen = () => {
            console.log('WS connected');
            ws.send("Hello, server!\n");
        };
        ws.onmessage = (e) => {
            console.log('MSG:', e.data);
        };
        ws.onclose = () => {
            console.log('WS closed');
        };
    </script>
</body>
</html>
